name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_archive:
        description: Create a signed App Store archive
        required: true
        type: boolean
        default: false
      run_simulator_tests:
        description: Launch the simulator and execute unit tests
        required: true
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: StillPath
  PROJECT: StillPath.xcodeproj
  DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project "$PROJECT"

      - name: Choose an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No available iPhone simulator found')
          PY
          )"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build app and unit tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Boot simulator and run unit tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests
        run: |
          set -o pipefail
          xcrun simctl boot "${{ steps.simulator.outputs.id }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.id }}" -b
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 120 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcode-test-diagnostics
          path: |
            xcodebuild-test.log
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  signed-archive:
    name: Signed App Store archive
    if: github.event_name == 'workflow_dispatch' && inputs.signed_archive
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          brew install xcodegen
          xcodegen generate

      - name: Install App Store Connect authentication key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_ID"
          test -n "$API_PRIVATE_KEY"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create developer archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StillPath.xcarchive" \
            -derivedDataPath "$DERIVED_DATA" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-archive.log
          /usr/libexec/PlistBuddy \
            -c "Set :ApplicationProperties:Team $APPLE_TEAM_ID" \
            "$RUNNER_TEMP/StillPath.xcarchive/Info.plist"

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cp ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StillPath.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            | tee xcodebuild-export.log

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v5
        with:
          name: StillPath-App-Store
          path: |
            ${{ runner.temp }}/export/*.ipa
            xcodebuild-archive.log
            xcodebuild-export.log
          if-no-files-found: error
          retention-days: 14

      - name: Deliver build to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          grep -q 'UPLOAD SUCCEEDED' "$RUNNER_TEMP/altool-upload.log"

      - name: Remove authentication key
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          rm -f "$AUTH_KEY_PATH"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

