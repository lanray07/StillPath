name: StillPath
options:
  bundleIdPrefix: com.stillpath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  StillPath:
    type: application
    platform: iOS
    sources:
      - path: StillPath
    resources:
      - path: StillPath/Resources
      - path: StillPath/Configuration/StillPath.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StillPath.app
        PRODUCT_NAME: StillPath
        INFOPLIST_FILE: StillPath/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: StillPath/Resources/StillPath.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: StillPathWidgets
        embed: true
  StillPathWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StillPathWidgets
    resources:
      - path: StillPathWidgets/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StillPath.app.widgets
        PRODUCT_NAME: StillPathWidgets
        INFOPLIST_FILE: StillPathWidgets/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: StillPathWidgets/Resources/StillPathWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  StillPathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StillPathTests
    dependencies:
      - target: StillPath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillpath.tests
schemes:
  StillPath:
    build:
      targets:
        StillPath: all
        StillPathWidgets: all
        StillPathTests: [test]
    test:
      targets:
        - StillPathTests
    run:
      config: Debug
    archive:
      config: Release

